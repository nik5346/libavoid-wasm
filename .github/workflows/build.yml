name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch adaptagrams source
        run: npm run fetch:adaptagrams
        env:
          # Pin this to a commit SHA for reproducible releases; see
          # scripts/fetch-adaptagrams.sh.
          ADAPTAGRAMS_REF: master

      - name: Set up emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build wasm module
        run: npm run build:wasm

      - name: Build TypeScript wrapper
        run: npm run build:ts

      - name: Run tests
        run: npm test

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
